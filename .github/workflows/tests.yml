name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for a read-only test job (repo default may already be read).
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Runtime pins (numpy 2.5+) require Python >= 3.12.
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m unittest discover -s tests -v
